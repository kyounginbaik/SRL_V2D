# Add to an existing floating-Sharpa training command with:
# +bilevel=wrench_hypergradient reset.fixed_initial_state=true reset.voc_decay_steps=0
engine: wrench_hypergradient
mode: reactor_wrench
study_variant: chunk
edit_scope: full
chunk_seconds: 1.0
warmup: 501760
interval: 501760
# Required by the shared scene/window constructor; no candidate population is
# evaluated by this engine. It evaluates one actor proposal per selected window.
eval_worlds: ${scene.world_count}
upper_trials: ${scene.world_count}
fixed_start: true
failure_baseline_worlds: 0
acceptance_mode: local_nominal
robust_confirmation: false
contact_proximity_weight: 0.0
cws_weight: 5.0
cws_tolerance: 0.1
wrist_translation_offset_m: 0.03
wrist_translation_correction_speed_m_s: 0.10
local_translation_step_m: 0.02
hyper_replay_capacity: 32768
hyper_capture_stride: 4
hyper_capture_worlds: 32
# Separate experimental recipe. Zero disables intermediate critic fitting.
# Actor/refinement timing remains unchanged. This adds at most ~60 critic
# updates between outer rounds at 2048 worlds, without new simulation work.
critic_online_interval_vector_steps: 16
critic_online_updates: 4
diagnostic_save_trials: true
hypergradient:
  inner_steps: 3
  inner_optimizer: adam
  inner_adam_eps_root: 1.0e-12
  # Used only by the optional legacy SGD response.
  inner_rate: 0.0001
  upper_rate: 0.001
  upper_steps: 4
  radius: 0.25
  regularization: 0.01
  discount: 0.99
  critic_rate: 0.0003
  critic_updates: 64
  batch_size: 128
  target_rate: 0.01
  trial_critic_updates: 32
  trial_mc_weight: 1.0
  cost_scale: 0.01
adaptation:
  acceptance_mode: finite_response
  maximum_confirmations: 2
  minimum_absolute_improvement: 0.001
  minimum_relative_improvement: 0.005
  # Bounded failure-window adaptation; all windows still receive matched tests.
  # 448 vector steps covers this 335-frame episode including the checkpoint tail.
  budget_mode: bounded_window
  minimum_vector_steps: 64
  checkpoint_stride_vector_steps: 32
  maximum_vector_steps: 448
  window_tail_vector_steps: 16
  # Retained only for the optional legacy reference_passes budget mode.
  checkpoints: [50000, 100000, 200000]
  minimum_reference_passes: [1, 2, 4]
  replay_capacity: 262144
  replay_minimum_size: 8192
  minimum_actor_updates: 32
  minimum_critic_updates: 32
  minimum_window_samples: 128
  stable_comparisons: 1
  cost_relative_tolerance: 0.05
  position_tolerance_m: 0.003
  orientation_tolerance_rad: 0.03
  success_tolerance: 0.02
